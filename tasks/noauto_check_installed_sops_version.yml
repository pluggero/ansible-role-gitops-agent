---
- name: Check installed sops version
  ansible.builtin.command: sops --version
  register: gitops_agent_sops_version_check
  ignore_errors: true
  changed_when: false
  failed_when: false

- name: Set installed sops version fact
  ansible.builtin.set_fact:
    gitops_agent_sops_installed_version: >-
      {{ (gitops_agent_sops_version_check.stdout | default('') | regex_search('sops (\d+\.\d+\.\d+)', '\1'))
         | default([''], true) | first }}
